# Serves the built SPA and reverse-proxies /api to the backend service.
# Used by the production Docker image (see Dockerfile and ../docker-compose.yml).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets are content-hashed by Vite; cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Forward API calls to the Go service. `backend` is the compose service name.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every other path returns index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
