# Serves the built SPA and reverse-proxies /api to the backend service.
# Used by the production Docker image (see Dockerfile and ../docker-compose.yml).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses; assets are already small but it helps index.html.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Content-hashed by Vite — safe to cache forever. Missing asset => 404,
    # never the SPA fallback.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy the API to the Go service.
    #
    # Docker's embedded DNS (127.0.0.11) plus a variable upstream forces nginx to
    # resolve "backend" per request instead of once at startup, so the container
    # starts even if the backend is briefly unavailable and survives a backend
    # restart that changes its IP.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $upstream http://backend:8080;
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # SPA fallback: every other path returns index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
