# Runs the whole stack: Go API + React SPA behind nginx.
#
#   docker compose up --build
#   open http://localhost:8080
#
# nginx serves the built frontend and reverse-proxies /api to the backend, so
# only one port is published.

services:
  backend:
    build: ./backend
    environment:
      # Same-origin requests come through nginx, so CORS is not strictly needed;
      # this keeps direct calls to the API working during debugging.
      CORS_ALLOWED_ORIGINS: "http://localhost:8080"
      LOG_LEVEL: info
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
